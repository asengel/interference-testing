[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interference-testing"
version = "0.6.0"
description = "Analytical interference-test simulation and nonlinear history matching"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[tool.setuptools]
packages = ["interference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
